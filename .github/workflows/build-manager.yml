name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/debug.keystore'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/debug.keystore'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_call:
  workflow_dispatch:
jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      key_alias: ${{ steps.gen.outputs.key_alias }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare generated or debug keystore
        id: gen
        env:
          BUILD_EVENT: ${{ github.event_name }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ "$BUILD_EVENT" = "pull_request" ]; then
            KEY_ALIAS=pr-key
            KEYSTORE_PASSWORD=$(openssl rand -hex 32)
            KEY_PASSWORD=$(openssl rand -hex 32)
            keytool -genkeypair \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 \
              -validity 1 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=KernelSU PR Build" \
              -storetype JKS \
              -keystore signing-key.jks
          elif [ -z "$PROD_KEYSTORE" ]; then
            # Public, stable development key shared by Gradle, repack, and LKM.
            cp .github/debug.keystore signing-key.jks
            KEY_ALIAS=androiddebugkey
            KEYSTORE_PASSWORD=android
            KEY_PASSWORD=android
          else
            exit 0
          fi

          {
            echo "key_alias=$KEY_ALIAS"
            echo "keystore_password=$KEYSTORE_PASSWORD"
            echo "key_password=$KEY_PASSWORD"
            echo "keystore=$(base64 -w 0 signing-key.jks)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract certificate hash and size
        if: steps.gen.outputs.keystore != ''
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.gen.outputs.key_alias }}
        run: |
          # Export DER certificate
          keytool -exportcert \
            -alias "$KEY_ALIAS" \
            -keystore signing-key.jks \
            -storepass "$STORE_PASS" \
            -file signing-cert.der

          # Calculate size in hex
          SIZE_DEC=$(stat -c%s signing-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")

          # Calculate SHA256 hash
          HASH=$(sha256sum signing-cert.der | awk '{print $1}')
          {
            echo "expected_size=$SIZE_HEX"
            echo "expected_hash=$HASH"
          } >> "$GITHUB_OUTPUT"

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash || '' }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
          - target: riscv64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
  
  build-ksud-extra:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu # windows pc
            os: ubuntu-latest
          - target: x86_64-apple-darwin # Intel mac
            os: macos-latest
          - target: aarch64-apple-darwin # M chip mac
            os: macos-latest
          - target: aarch64-unknown-linux-musl # arm64 Linux
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl # x86 Linux
            os: ubuntu-latest
    uses: ./.github/workflows/ksud-extra.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: [generate-key]
    if: always() && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' )) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties
            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          fi

      - name: Write generated or debug key
        if: needs.generate-key.outputs.keystore != ''
        env:
          GENERATED_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          GENERATED_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          GENERATED_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          GENERATED_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$GENERATED_KEYSTORE" | base64 -d > signing-key.jks
          {
            echo KEYSTORE_PASSWORD="$GENERATED_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$GENERATED_KEY_ALIAS"
            echo KEY_PASSWORD="$GENERATED_KEY_PASSWORD"
            echo KEYSTORE_FILE='signing-key.jks'
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease
          fi

      - name: Upload build artifact
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        if: ${{ ( github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' )) || github.ref_type == 'tag' }}
        with:
          name: "mappings"
          path: "manager/app/build/outputs/mapping/release/"

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> "$GITHUB_OUTPUT"
          else
            echo "UPLOAD=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download RISC-V ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-riscv64-linux-android
          path: artifacts/ksud-riscv64-linux-android

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          mkdir -p target/riscv64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          RISCV64_KSUD=$(find artifacts/ksud-riscv64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          test -n "$RISCV64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud
          cp -f "$RISCV64_KSUD" target/riscv64-linux-android/release/ksud

      - name: Prepare signing inputs
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        env:
          GENERATED_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          GENERATED_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          GENERATED_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          GENERATED_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$GENERATED_KEYSTORE" ]; then
            echo "$GENERATED_KEYSTORE" | base64 -d > signing-key.jks
            SIGN_KEYSTORE_FILE=signing-key.jks
            SIGN_KEY_ALIAS=$GENERATED_KEY_ALIAS
            SIGN_KEYSTORE_PASSWORD=$GENERATED_KEYSTORE_PASSWORD
            SIGN_KEY_PASSWORD=$GENERATED_KEY_PASSWORD
          else
            test -n "$PROD_KEYSTORE"
            echo "$PROD_KEYSTORE" | base64 -d > key.jks
            SIGN_KEYSTORE_FILE=key.jks
            SIGN_KEY_ALIAS=$PROD_KEY_ALIAS
            SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD
            SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD
          fi
          {
            echo "SIGN_KEYSTORE_FILE=$SIGN_KEYSTORE_FILE"
            echo "SIGN_KEY_ALIAS=$SIGN_KEY_ALIAS"
            echo "SIGN_KEYSTORE_PASSWORD=$SIGN_KEYSTORE_PASSWORD"
            echo "SIGN_KEY_PASSWORD=$SIGN_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Repack and resign
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a x86_64 \
            -a riscv64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Upload build artifact
        if: ${{ github.event_name == 'pull_request' || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: dist/*.apk

      - name: Upload to telegram
        if: github.event_name != 'pull_request' && steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          GITHUB_EVENT: ${{ toJson(github.event) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Manager
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            VERSION=$(git rev-list --count HEAD)
            export VERSION
            mapfile -t APKS < <(find ./dist -name "*.apk")
            pip3 install telethon
            python3 "$GITHUB_WORKSPACE/scripts/ksubot.py" "${APKS[@]}"
          fi
